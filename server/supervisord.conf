# Supervisord config: run TWO processes in one container
#   1. coturn TURN relay  (UDP/TCP :3478 + relay port range)
#   2. node signaling server + static host  (HTTP/WS :8081, HTTPS/WSS :8443)
#
# We need both in the same container so the user can `docker run` once and get
# signaling + TURN together. Supervisord restarts either process if it crashes.
#
# Install to /etc/supervisord.conf in the image.

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:coturn]
command=turnserver -c /app/server/turnserver.conf
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
priority=10

[program:bb-signaling]
command=node server/server.js
directory=/app
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
priority=20
