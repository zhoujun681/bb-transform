# coturn TURN server config for the bb-transform LAN app.
#
# Runs INSIDE the Docker container alongside the Node signaling relay. Two
# processes share one container (started by supervisord — see Dockerfile).
#
# We use a STATIC credential pair (good enough for a trusted LAN). Edit the two
# values below and set the SAME values in the web page's "TURN 服务器" box, or
# hard-code them in index.html (see the BT_TURN note in app.js / core/mesh.js).
#
# IMPORTANT: TURN listens on 3478 (TCP+UDP). Media/relay uses the
# min-port..max-port UDP range. The container uses host networking, so these
# ports are bound directly on the Docker host.

# ---- listening ----
listening-port=3478
# The container uses Linux host networking, so advertise the server address
# reachable by both client networks.
listening-ip=172.16.200.122
relay-ip=172.16.200.122
external-ip=172.16.200.122

# ---- relay (allocation) UDP port range ----
# Each ongoing TURN allocation uses ONE of these ports. 20 is plenty for a few
# phones; raise it and publish more host ports if you scale up.
min-port=49152
max-port=49171

# ---- realm + static credentials ----
# realm can be anything; the browser must send credentials for THIS realm.
realm=bb-transform
# static long-term credential:  user:password
user=bbuser:bbpass123

# ---- behavior ----
# LAN-friendly: don't require TLS (DTLS still secures the media). TLS would need
# certs and a TLS-listening-port; skip for a trusted LAN.
no-tls
no-dtls
# Don't print verbose logs; keep the container log readable.
# (remove this line to debug: coturn prints candidate/gather diagnostics)
# verbose
# Allow fingerprint usage (most browsers require it).
fingerprint
# Long-term credential mechanism (RFC 5389) — what browsers expect.
lt-cred-mech
# Don't relay traffic between two peers on the same server (loopback) — minor
# safety. Comment out if you ever need hairpin.
no-loopback-peers
# Keep the process in the foreground so supervisord can manage it.
no-cli
