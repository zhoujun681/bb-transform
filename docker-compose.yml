services:
  bb-transform:
    build: .
    image: bb-transform:latest
    container_name: bb-transform
    # Host networking is intentional: coturn must advertise the host's
    # reachable address, not a Docker bridge address, in its relay candidates.
    network_mode: host
    environment:
      - PORT=8081
      - HTTPS_PORT=8443
    restart: unless-stopped
